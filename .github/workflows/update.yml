name: Günlük güncelleme ve yayın

on:
  schedule:
    - cron: "0 4 * * *"    # her gün 07:00 (Türkiye)
    - cron: "0 13 * * *"   # her gün 16:00 (Türkiye)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Haberleri tara
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch.py

      - name: Veriyi kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "kampus-postasi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "Haberler güncellendi: $(date -u +%Y-%m-%d)"
          git push

      - id: pages
        uses: actions/configure-pages@v5

      - name: Siteyi üret
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          BASE_PATH: ${{ vars.SITE_URL && '' || steps.pages.outputs.base_path }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
